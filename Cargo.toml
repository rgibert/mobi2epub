[package]
name = "mobi2epub"
version = "0.1.0"
edition = "2021"
description = "Convert MOBI ebooks to EPUB"
license = "MIT"

[dependencies]
# Crash/error reporting. The ureq transport uses rustls, so release builds
# stay free of OpenSSL (needed for the static musl Linux binaries).
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "ureq"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep the symbol table so Sentry stack traces show function names.
strip = "debuginfo"
