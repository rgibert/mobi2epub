name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pull requests may change dependencies, so they build without --locked;
  # everything else must match the committed Cargo.lock.
  CARGO_LOCKED: ${{ github.event_name != 'pull_request' && '--locked' || '' }}

jobs:
  lockfile:
    # Commit a refreshed Cargo.lock to same-repo PR branches when
    # Cargo.toml changed, so main and releases can build with --locked.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit Cargo.lock if it changed
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Cargo.lock" -- Cargo.lock
            git push
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release $CARGO_LOCKED
      - name: Convert and validate synthetic MOBI books
        run: |
          python3 tests/make_mobi.py test-out
          ./target/release/mobi2epub test-out/*.mobi
          for f in test-out/*.mobi; do python3 tests/check_epub.py "$f" "${f%.mobi}.epub"; done

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          # Baked into release binaries; empty (reporting off) if the secret isn't set.
          MOBI2EPUB_SENTRY_DSN: ${{ github.event_name == 'release' && secrets.SENTRY_DSN || '' }}
        run: cargo build --release $CARGO_LOCKED --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          dir="mobi2epub-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE "$dir/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/mobi2epub.exe" "$dir/"
            archive="$dir.zip"
            7z a -tzip "$archive" "$dir" > /dev/null
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "target/${{ matrix.target }}/release/mobi2epub" "$dir/"
            archive="$dir.tar.gz"
            tar czf "$archive" "$dir"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --clobber
      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mobi2epub-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}*
