name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Convert and validate synthetic MOBI books
        run: |
          python3 tests/make_mobi.py test-out
          ./target/release/mobi2epub test-out/*.mobi
          for f in test-out/*.mobi; do python3 tests/check_epub.py "$f" "${f%.mobi}.epub"; done

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          dir="mobi2epub-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE "$dir/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/mobi2epub.exe" "$dir/"
            archive="$dir.zip"
            7z a -tzip "$archive" "$dir" > /dev/null
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "target/${{ matrix.target }}/release/mobi2epub" "$dir/"
            archive="$dir.tar.gz"
            tar czf "$archive" "$dir"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --clobber
      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mobi2epub-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}*
